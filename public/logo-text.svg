<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 38" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&amp;display=swap');
    .logo-text {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 26px;
      fill: #171717;
    }
    .logo-symbol-circle {
      fill: #171717;
    }
    @media (prefers-color-scheme: dark) {
      .logo-text {
        fill: #ffffff;
      }
      .logo-symbol-circle {
        fill: #ffffff;
      }
      .logo-symbol-details {
        stroke: #171717 !important;
      }
    }
  </style>

  <!-- Logo Symbol (Lens/Aperture) -->
  <g transform="translate(4, 3)">
    <!-- Solid circle background -->
    <circle cx="16" cy="16" r="15" class="logo-symbol-circle" />
    
    <!-- White lens details -->
    <circle cx="16" cy="16" r="7.5" stroke="#ffffff" stroke-width="1.8" fill="none" class="logo-symbol-details" />
    <circle cx="16" cy="16" r="3.5" stroke="#ffffff" stroke-width="1.2" fill="none" class="logo-symbol-details" />
    <line x1="10" y1="10" x2="13.5" y2="13.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" class="logo-symbol-details" />
    <line x1="18.5" y1="18.5" x2="22" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" class="logo-symbol-details" />
  </g>

  <!-- Typography "shottt." -->
  <text x="42" y="27" class="logo-text" letter-spacing="-0.04em">
    <tspan font-weight="300" opacity="0.8">sho</tspan><tspan font-weight="900" letter-spacing="-0.02em">ttt</tspan><tspan font-weight="900">.</tspan>
  </text>
</svg>
