<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" fill="none">
  <defs>
    <mask id="logo-text-s-mask">
      <!-- White allows the circle to render -->
      <rect x="0" y="0" width="170" height="60" fill="#ffffff" />
      <!-- Black cuts the 'S' monogram out of the icon circle -->
      <path d="M 68 40 C 68 30, 32 30, 32 40 C 32 49, 68 51, 68 60 C 68 70, 32 70, 32 60" 
            stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"
            transform="translate(25, 30) scale(0.35) translate(-50, -50)" />
    </mask>
  </defs>

  <!-- Logo Mark Icon (Solid Circle with transparent 'S' cutout) -->
  <circle cx="25" cy="30" r="18" fill="currentColor" mask="url(#logo-text-s-mask)" />

  <!-- Typography "shottt" -->
  <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- s -->
    <path d="M 78 29 C 78 25, 66 25, 66 29 C 66 34, 78 34, 78 39 C 78 44, 66 44, 66 40" />
    
    <!-- h -->
    <path d="M 88 15 L 88 44" />
    <path d="M 88 29 C 91 25, 100 25, 100 30 L 100 44" />
    
    <!-- o -->
    <circle cx="112" cy="35" r="8.5" />
    
    <!-- t1, t2, t3 -->
    <path d="M 129 19 L 129 44" />
    <path d="M 139 19 L 139 44" />
    <path d="M 149 19 L 149 44" />
    
    <!-- Connected crossbar for all three t's -->
    <path d="M 124 27 L 154 27" />
  </g>
</svg>
