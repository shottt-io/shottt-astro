<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .logo-stroke { stroke: #171717; }
    .logo-fill { fill: #171717; }
    @media (prefers-color-scheme: dark) {
      .logo-stroke { stroke: #ffffff; }
      .logo-fill { fill: #ffffff; }
    }
  </style>

  <!-- Viewfinder corners -->
  <path class="logo-stroke" d="M 24 36 V 24 H 36" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="logo-stroke" d="M 76 36 V 24 H 64" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="logo-stroke" d="M 24 64 V 76 H 36" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="logo-stroke" d="M 76 64 V 76 H 64" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Camera lens / Shutter ring -->
  <circle class="logo-stroke" cx="50" cy="50" r="18" stroke-width="5.5" fill="none" />
  
  <!-- Shutter blades -->
  <path class="logo-stroke" d="M 50 32 L 50 42" stroke-width="3.5" stroke-linecap="round" />
  <path class="logo-stroke" d="M 34 59 L 43 54" stroke-width="3.5" stroke-linecap="round" />
  <path class="logo-stroke" d="M 66 59 L 57 54" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Inner core lens -->
  <circle class="logo-fill" cx="50" cy="50" r="5" />
</svg>
