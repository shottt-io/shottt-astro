<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Viewfinder corners -->
  <path d="M 24 36 V 24 H 36" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 76 36 V 24 H 64" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 24 64 V 76 H 36" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 76 64 V 76 H 64" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Camera lens / Shutter ring -->
  <circle cx="50" cy="50" r="18" stroke="currentColor" stroke-width="5.5" fill="none" />
  
  <!-- Shutter blades (slanted incisions for a premium aperture look) -->
  <path d="M 50 32 L 50 42" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 34 59 L 43 54" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 66 59 L 57 54" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Inner core lens -->
  <circle cx="50" cy="50" r="5" fill="currentColor" />
</svg>
