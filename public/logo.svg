<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <mask id="s-mask">
      <!-- Background white allows the circle to show -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <!-- Black path cuts the 'S' monogram out of the circle -->
      <path d="M 68 40 C 68 30, 32 30, 32 40 C 32 49, 68 51, 68 60 C 68 70, 32 70, 32 60" 
            stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </mask>
  </defs>

  <!-- Solid circle that adapts to context color and has the mask applied -->
  <circle cx="50" cy="50" r="42" fill="currentColor" mask="url(#s-mask)" />
</svg>
